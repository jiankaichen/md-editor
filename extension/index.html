<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MD Editor</title>
  <link rel="stylesheet" href="viewer.css">
  <link rel="stylesheet" href="vendor/github.min.css" id="hljs-theme">
</head>
<body>
<div id="app">
  <div id="toolbar">
    <h1>MD Editor</h1>
    <span id="file-name">No file open</span>
    <button class="btn primary" id="open-btn">Open file</button>
    <button class="btn" id="edit-btn" disabled>Edit</button>
    <button class="btn" id="save-btn" disabled>Save</button>
    <button class="btn" id="autosave-btn" disabled title="Toggle auto-save (every 10s to localStorage)">Auto-save: Off</button>
    <button class="btn" id="toc-btn">TOC</button>
    <button class="btn" id="theme-btn" title="Toggle dark mode">&#9680;</button>
    <input type="file" id="file-input" accept=".md,.markdown,.txt" style="display:none">
    <span id="autosave-status" style="font-size:12px;color:var(--text-muted);margin-left:2px;"></span>
    <span id="debug-status" style="font-size:12px;color:#f85149;margin-left:4px;"></span>
  </div>

  <div id="main">
    <nav id="toc-panel" class="hidden">
      <h2>Contents</h2>
      <ul id="toc-list"></ul>
    </nav>

    <div id="split">
      <div id="editor-pane">
        <div id="editor-label">Markdown</div>
        <textarea id="editor" spellcheck="false"></textarea>
      </div>

      <div id="divider"></div>

      <div id="preview-pane">
        <div id="preview-label">Preview</div>
        <div id="content-wrap">
          <div id="content">
            <div id="drop-zone">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
                <polyline points="10 9 9 9 8 9"/>
              </svg>
              <p>Drop a Markdown file here</p>
              <small>or click <strong>Open file</strong> above</small>
            </div>
            <div id="markdown-output"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="vendor/marked.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="vendor/mermaid.min.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
