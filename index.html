<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MD Editor</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-theme">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --bg-secondary: #f6f8fa;
      --border: #d0d7de;
      --text: #1f2328;
      --text-muted: #656d76;
      --accent: #0969da;
      --accent-hover: #0550ae;
      --toolbar-bg: #f6f8fa;
      --code-bg: #f6f8fa;
      --blockquote-border: #d0d7de;
      --editor-bg: #ffffff;
    }

    [data-theme="dark"] {
      --bg: #0d1117;
      --bg-secondary: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79c0ff;
      --toolbar-bg: #161b22;
      --code-bg: #161b22;
      --blockquote-border: #3d444d;
      --editor-bg: #0d1117;
    }

    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); }

    #app { display: flex; flex-direction: column; height: 100vh; }

    /* Toolbar */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--toolbar-bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #toolbar h1 { font-size: 15px; font-weight: 600; }

    #file-name {
      font-size: 13px;
      color: var(--text-muted);
      margin-right: auto;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 280px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.1s;
    }
    .btn:hover { background: var(--bg-secondary); }
    .btn.primary { background: var(--accent); color: #fff; border-color: transparent; }
    .btn.primary:hover { background: var(--accent-hover); }
    .btn.active { background: var(--accent); color: #fff; border-color: transparent; }
    .btn:disabled { opacity: 0.4; cursor: default; }

    /* Layout */
    #main { display: flex; flex: 1; overflow: hidden; }

    /* TOC */
    #toc-panel {
      width: 220px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      background: var(--bg-secondary);
      padding: 16px 12px;
      font-size: 13px;
      transition: width 0.2s, padding 0.2s;
    }
    #toc-panel.hidden { width: 0; padding: 0; overflow: hidden; }

    #toc-panel h2 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    #toc-list { list-style: none; }
    #toc-list a {
      display: block;
      padding: 3px 0;
      color: var(--text-muted);
      text-decoration: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: color 0.1s;
    }
    #toc-list a:hover { color: var(--accent); }
    #toc-list a.active { color: var(--accent); font-weight: 500; }
    #toc-list .toc-h1 { padding-left: 0; font-weight: 600; }
    #toc-list .toc-h2 { padding-left: 12px; }
    #toc-list .toc-h3 { padding-left: 24px; font-size: 12px; }
    #toc-list .toc-h4 { padding-left: 36px; font-size: 12px; }

    /* Split pane */
    #split {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Editor pane */
    #editor-pane {
      display: none;
      flex-direction: column;
      width: 50%;
      min-width: 120px;
      flex-shrink: 0;
      overflow: hidden;
    }

    #editor-pane.visible { display: flex; }

    #divider {
      display: none;
      width: 5px;
      flex-shrink: 0;
      background: var(--border);
      cursor: col-resize;
      transition: background 0.1s;
    }
    #divider:hover, #divider.dragging { background: var(--accent); }
    #editor-pane.visible ~ #divider { display: block; }

    #editor-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      padding: 6px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-secondary);
      flex-shrink: 0;
    }

    #editor {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      padding: 24px;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 14px;
      line-height: 1.6;
      background: var(--editor-bg);
      color: var(--text);
      overflow-y: auto;
    }

    /* Preview pane */
    #preview-pane {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }

    #preview-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      padding: 6px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-secondary);
      flex-shrink: 0;
      display: none;
    }

    #preview-pane.split #preview-label { display: block; }

    #content-wrap { flex: 1; overflow-y: auto; padding: 40px 24px; scroll-behavior: smooth; }
    #content { max-width: 800px; margin: 0 auto; }

    /* Drop zone */
    #drop-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      height: 100%;
      min-height: 300px;
      text-align: center;
      color: var(--text-muted);
      border-radius: 8px;
      transition: background 0.15s, border 0.15s;
    }
    #drop-zone svg { opacity: 0.35; }
    #drop-zone p { font-size: 16px; }
    #drop-zone small { font-size: 13px; }
    #drop-zone.drag-over {
      background: color-mix(in srgb, var(--accent) 10%, transparent);
      border: 2px dashed var(--accent);
    }

    /* Markdown output */
    #markdown-output { display: none; line-height: 1.7; font-size: 16px; }

    #markdown-output h1, #markdown-output h2, #markdown-output h3,
    #markdown-output h4, #markdown-output h5, #markdown-output h6 {
      margin-top: 1.5em;
      margin-bottom: 0.5em;
      font-weight: 600;
      line-height: 1.25;
      scroll-margin-top: 70px;
    }
    #markdown-output h1 { font-size: 2em; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
    #markdown-output h2 { font-size: 1.5em; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
    #markdown-output h3 { font-size: 1.25em; }
    #markdown-output h4 { font-size: 1em; }

    #markdown-output p { margin-bottom: 1em; }
    #markdown-output a { color: var(--accent); text-decoration: none; }
    #markdown-output a:hover { text-decoration: underline; }

    #markdown-output ul, #markdown-output ol { margin: 0 0 1em 1.5em; }
    #markdown-output li { margin-bottom: 0.25em; }
    #markdown-output li.has-children > .li-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      margin-left: -20px;
      margin-right: 4px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 10px;
      border-radius: 3px;
      user-select: none;
      transition: color 0.1s;
      vertical-align: middle;
    }
    #markdown-output li.has-children > .li-toggle:hover { color: var(--accent); }
    #markdown-output li.collapsed > ul,
    #markdown-output li.collapsed > ol { display: none; }

    #markdown-output blockquote {
      margin: 0 0 1em;
      padding: 0 1em;
      color: var(--text-muted);
      border-left: 4px solid var(--blockquote-border);
    }

    #markdown-output code {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 0.875em;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.1em 0.4em;
    }

    #markdown-output pre {
      margin-bottom: 1em;
      border-radius: 6px;
      overflow-x: auto;
      border: 1px solid var(--border);
    }
    #markdown-output pre code {
      display: block;
      padding: 16px;
      background: var(--code-bg);
      border: none;
      border-radius: 0;
      font-size: 0.875em;
      line-height: 1.5;
    }

    #markdown-output table { width: 100%; border-collapse: collapse; margin-bottom: 1em; font-size: 0.9em; }
    #markdown-output th, #markdown-output td { padding: 6px 13px; border: 1px solid var(--border); }
    #markdown-output th { font-weight: 600; background: var(--bg-secondary); }
    #markdown-output tr:nth-child(even) td { background: var(--bg-secondary); }

    #markdown-output img { max-width: 100%; border-radius: 6px; }
    .mermaid-diagram {
      margin-bottom: 1em;
      overflow: hidden;
      position: relative;
      cursor: grab;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-secondary);
      user-select: none;
    }
    .mermaid-diagram.panning { cursor: grabbing; }
    .mermaid-diagram .mermaid-inner { position: absolute; transform-origin: 0 0; }
    .mermaid-diagram svg { display: block; }
    .mermaid-controls {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 4px;
      z-index: 10;
    }
    .mermaid-controls button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      opacity: 0.75;
      transition: opacity 0.1s, background 0.1s;
    }
    .mermaid-controls button:hover { opacity: 1; background: var(--bg-secondary); }
    #markdown-output hr { border: none; border-top: 1px solid var(--border); margin: 1.5em 0; }
    #markdown-output input[type="checkbox"] { margin-right: 0.4em; vertical-align: middle; }

    /* Dark mode hljs */
    [data-theme="dark"] .hljs { background: var(--code-bg) !important; color: #e6edf3 !important; }
    [data-theme="dark"] .hljs-keyword, [data-theme="dark"] .hljs-selector-tag { color: #ff7b72; }
    [data-theme="dark"] .hljs-string, [data-theme="dark"] .hljs-attr { color: #a5d6ff; }
    [data-theme="dark"] .hljs-number, [data-theme="dark"] .hljs-literal { color: #79c0ff; }
    [data-theme="dark"] .hljs-comment { color: #8b949e; }
    [data-theme="dark"] .hljs-built_in, [data-theme="dark"] .hljs-title { color: #d2a8ff; }
    [data-theme="dark"] .hljs-variable { color: #ffa657; }
    [data-theme="dark"] .hljs-tag { color: #7ee787; }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
  </style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <h1>MD Editor</h1>
    <span id="file-name">No file open</span>
    <button class="btn primary" id="open-btn">Open file</button>
    <button class="btn" id="edit-btn" disabled>Edit</button>
    <button class="btn" id="save-btn" disabled>Save</button>
    <button class="btn" id="autosave-btn" disabled title="Toggle auto-save (every 10s to localStorage)">Auto-save: Off</button>
    <button class="btn" id="toc-btn">TOC</button>
    <button class="btn" id="theme-btn" title="Toggle dark mode">&#9680;</button>
    <input type="file" id="file-input" accept=".md,.markdown,.txt" style="display:none">
    <span id="autosave-status" style="font-size:12px;color:var(--text-muted);margin-left:2px;"></span>
    <span id="debug-status" style="font-size:12px;color:#f85149;margin-left:4px;"></span>
  </div>

  <div id="main">
    <nav id="toc-panel" class="hidden">
      <h2>Contents</h2>
      <ul id="toc-list"></ul>
    </nav>

    <div id="split">
      <div id="editor-pane">
        <div id="editor-label">Markdown</div>
        <textarea id="editor" spellcheck="false"></textarea>
      </div>

      <div id="divider"></div>

      <div id="preview-pane">
        <div id="preview-label">Preview</div>
        <div id="content-wrap">
          <div id="content">
            <div id="drop-zone">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
                <polyline points="10 9 9 9 8 9"/>
              </svg>
              <p>Drop a Markdown file here</p>
              <small>or click <strong>Open file</strong> above</small>
            </div>
            <div id="markdown-output"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const fileInput   = document.getElementById('file-input');
  const openBtn     = document.getElementById('open-btn');
  const editBtn     = document.getElementById('edit-btn');
  const saveBtn       = document.getElementById('save-btn');
  const autosaveBtn   = document.getElementById('autosave-btn');
  const autosaveStatus = document.getElementById('autosave-status');
  const tocBtn        = document.getElementById('toc-btn');
  const themeBtn    = document.getElementById('theme-btn');
  const dropZone    = document.getElementById('drop-zone');
  const output      = document.getElementById('markdown-output');
  const fileLabel   = document.getElementById('file-name');
  const tocPanel    = document.getElementById('toc-panel');
  const tocList     = document.getElementById('toc-list');
  const contentWrap = document.getElementById('content-wrap');
  const hljsTheme   = document.getElementById('hljs-theme');
  const editorPane  = document.getElementById('editor-pane');
  const previewPane = document.getElementById('preview-pane');
  const editor      = document.getElementById('editor');
  const debugEl     = document.getElementById('debug-status');

  let currentFileName = '';
  let editMode = false;

  // ── Debug ─────────────────────────────────────────────────────────────────
  function dbg(msg) { debugEl.textContent = msg; }

  // ── Theme ─────────────────────────────────────────────────────────────────
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
  let darkMode = prefersDark.matches;

  function applyTheme() {
    document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
    hljsTheme.href = darkMode
      ? 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css'
      : 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css';
    mermaid.initialize({ startOnLoad: false, theme: darkMode ? 'dark' : 'default' });
    rerenderMermaid();
  }

  async function rerenderMermaid() {
    let idx = 0;
    for (const div of output.querySelectorAll('.mermaid-diagram')) {
      const source = div.dataset.mermaidSource;
      if (!source) continue;
      const id = 'mermaid-rerender-' + (++idx) + '-' + Date.now();
      try {
        const { svg } = await mermaid.render(id, source);
        const inner = div.querySelector('.mermaid-inner');
        inner.innerHTML = svg;
        const svgEl = inner.querySelector('svg');
        if (svgEl) {
          const vb = svgEl.viewBox?.baseVal;
          const svgW = parseFloat(svgEl.style.maxWidth) || vb?.width || parseFloat(svgEl.getAttribute('width')) || 400;
          const svgH = vb?.height || parseFloat(svgEl.getAttribute('height')) || 300;
          svgEl.setAttribute('width', svgW);
          svgEl.setAttribute('height', svgH);
          svgEl.style.maxWidth = 'none';
        }
      } catch (err) {
        console.error('mermaid rerender error', err);
      }
    }
  }

  applyTheme();
  prefersDark.addEventListener('change', e => { darkMode = e.matches; applyTheme(); });
  themeBtn.addEventListener('click', () => { darkMode = !darkMode; applyTheme(); });

  // ── Marked setup ──────────────────────────────────────────────────────────
  marked.use({ gfm: true });

  // ── File open ─────────────────────────────────────────────────────────────
  openBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => { if (e.target.files[0]) loadFile(e.target.files[0]); });

  // ── Drag & drop ───────────────────────────────────────────────────────────
  let dragDepth = 0;

  document.addEventListener('dragenter', e => {
    e.preventDefault();
    dragDepth++;
    dropZone.classList.add('drag-over');
  });
  document.addEventListener('dragleave', () => {
    dragDepth--;
    if (dragDepth === 0) dropZone.classList.remove('drag-over');
  });
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => {
    e.preventDefault();
    dragDepth = 0;
    dropZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file) loadFile(file);
  });

  // ── Edit mode toggle ──────────────────────────────────────────────────────
  editBtn.addEventListener('click', () => {
    editMode = !editMode;
    editBtn.textContent = editMode ? 'Read' : 'Edit';
    editBtn.classList.toggle('active', editMode);
    editorPane.classList.toggle('visible', editMode);
    previewPane.classList.toggle('split', editMode);
    tocPanel.classList.add('hidden');
    if (editMode) {
      editor.value = editor.dataset.source || '';
      editor.focus();
    }
  });

  // Live preview while editing
  let renderTimer = null;
  editor.addEventListener('input', () => {
    clearTimeout(renderTimer);
    renderTimer = setTimeout(() => renderPreview(editor.value), 150);
  });

  // ── Save ──────────────────────────────────────────────────────────────────
  saveBtn.addEventListener('click', () => {
    const text = editMode ? editor.value : editor.dataset.source;
    const blob = new Blob([text], { type: 'text/markdown' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = currentFileName || 'document.md';
    a.click();
    URL.revokeObjectURL(a.href);
  });

  // ── Auto-save ─────────────────────────────────────────────────────────────
  let autoSaveEnabled = false;
  let autoSaveTimer   = null;
  let statusClearTimer = null;

  function doAutoSave() {
    if (!currentFileName) return;
    const text = editor.value;
    try {
      localStorage.setItem('autosave:' + currentFileName, text);
      autosaveStatus.textContent = 'Saved ' + new Date().toLocaleTimeString();
      clearTimeout(statusClearTimer);
      statusClearTimer = setTimeout(() => { autosaveStatus.textContent = ''; }, 3000);
    } catch (e) {
      autosaveStatus.textContent = 'Save failed';
    }
  }

  function setAutoSave(enabled) {
    autoSaveEnabled = enabled;
    autosaveBtn.textContent = 'Auto-save: ' + (enabled ? 'On' : 'Off');
    autosaveBtn.classList.toggle('active', enabled);
    clearInterval(autoSaveTimer);
    if (enabled) {
      autoSaveTimer = setInterval(doAutoSave, 10000);
      doAutoSave();
    } else {
      autosaveStatus.textContent = '';
    }
  }

  autosaveBtn.addEventListener('click', () => setAutoSave(!autoSaveEnabled));

  // ── TOC toggle ────────────────────────────────────────────────────────────
  tocBtn.addEventListener('click', () => tocPanel.classList.toggle('hidden'));

  // ── Load & render ─────────────────────────────────────────────────────────
  function loadFile(file) {
    const reader = new FileReader();
    reader.onerror = () => dbg('ERROR: FileReader failed');
    reader.onload = e => {
      const text = e.target.result;
      currentFileName = file.name;
      const draft = localStorage.getItem('autosave:' + file.name);
      const content = draft || text;
      editor.dataset.source = content;
      editor.value = content;
      fileLabel.textContent = file.name + (draft ? ' (draft restored)' : '');
      editBtn.disabled = false;
      saveBtn.disabled = false;
      autosaveBtn.disabled = false;
      render(content);
    };
    reader.readAsText(file);
  }

  function makeListsToggleable() {
    output.querySelectorAll('li').forEach(li => {
      if (!li.querySelector(':scope > ul, :scope > ol')) return;
      li.classList.add('has-children');
      const toggle = document.createElement('span');
      toggle.className = 'li-toggle';
      toggle.textContent = '▼';
      toggle.addEventListener('click', e => {
        e.stopPropagation();
        const collapsed = li.classList.toggle('collapsed');
        toggle.textContent = collapsed ? '▶' : '▼';
      });
      li.prepend(toggle);
    });
  }

  async function applyOutput(html) {
    output.innerHTML = html;
    output.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(h => {
      h.id = h.textContent.toLowerCase().replace(/[^\w\s-]/g, '').replace(/\s+/g, '-');
    });
    makeListsToggleable();
    // Syntax highlight non-mermaid code blocks
    output.querySelectorAll('pre code:not(.language-mermaid)').forEach(block => hljs.highlightElement(block));
    // Render mermaid blocks
    let mermaidIdx = 0;
    for (const block of output.querySelectorAll('code.language-mermaid')) {
      const pre = block.parentElement;
      const source = block.textContent;
      const id = 'mermaid-' + (++mermaidIdx) + '-' + Date.now();
      try {
        const { svg } = await mermaid.render(id, source);
        const div = document.createElement('div');
        div.className = 'mermaid-diagram';
        div.dataset.mermaidSource = source;
        const inner = document.createElement('div');
        inner.className = 'mermaid-inner';
        inner.innerHTML = svg;
        div.appendChild(inner);

        // Extract natural SVG dimensions — read BEFORE overriding anything
        const svgEl = inner.querySelector('svg');
        let svgW = 400, svgH = 300;
        if (svgEl) {
          const vb = svgEl.viewBox?.baseVal;
          svgW = parseFloat(svgEl.style.maxWidth) || (vb?.width) || parseFloat(svgEl.getAttribute('width')) || 400;
          svgH = (vb?.height) || parseFloat(svgEl.getAttribute('height')) || 300;
          svgEl.setAttribute('width', svgW);
          svgEl.setAttribute('height', svgH);
          svgEl.style.maxWidth = 'none';
        }

        pre.replaceWith(div);

        // Height: fill remaining visible area of preview panel
        const wrapRect = contentWrap.getBoundingClientRect();
        const divRect  = div.getBoundingClientRect();
        div.style.height = Math.max(200, wrapRect.bottom - divRect.top - 32) + 'px';

        makePannable(div, inner, svgW, svgH);
      } catch (err) {
        block.textContent = 'Mermaid error: ' + err.message;
      }
    }
  }

  async function render(text) {
    try {
      const html = marked.parse(text);
      await applyOutput(html);
      dropZone.style.display = 'none';
      output.style.display = 'block';
      dbg('');
      buildTOC();
      contentWrap.scrollTop = 0;
    } catch (err) {
      dbg('ERROR: ' + err.message);
    }
  }

  async function renderPreview(text) {
    try {
      const html = marked.parse(text);
      await applyOutput(html);
      editor.dataset.source = text;
    } catch (err) {
      dbg('ERROR: ' + err.message);
    }
  }

  // ── TOC ───────────────────────────────────────────────────────────────────
  let scrollObserver = null;

  function buildTOC() {
    const headings = [...output.querySelectorAll('h1, h2, h3, h4')];
    tocList.innerHTML = '';

    if (headings.length === 0) { tocPanel.classList.add('hidden'); return; }

    headings.forEach(h => {
      const li = document.createElement('li');
      const a  = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = h.textContent;
      a.className = 'toc-' + h.tagName.toLowerCase();
      a.addEventListener('click', e => {
        e.preventDefault();
        h.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      li.appendChild(a);
      tocList.appendChild(li);
    });

    tocPanel.classList.remove('hidden');

    if (scrollObserver) scrollObserver.disconnect();
    scrollObserver = new IntersectionObserver(entries => {
      const visible = entries.filter(e => e.isIntersecting);
      if (!visible.length) return;
      const top = visible.sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
      tocList.querySelectorAll('a').forEach(a => a.classList.remove('active'));
      const link = tocList.querySelector(`a[href="#${top.target.id}"]`);
      if (link) link.classList.add('active');
    }, { root: contentWrap, rootMargin: '-10% 0px -80% 0px' });

    headings.forEach(h => scrollObserver.observe(h));
  }

  // ── Mermaid diagram pan + zoom ────────────────────────────────────────────
  function makePannable(container, inner, svgW, svgH) {
    let scale = 1, tx = 0, ty = 0;
    let isPanning = false, startX, startY, startTx, startTy;

    function applyTransform() {
      inner.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
    }

    function autoFit() {
      const cw = container.clientWidth;
      const ch = container.clientHeight;
      scale = Math.min(cw / svgW, ch / svgH);
      tx = (cw - svgW * scale) / 2;
      ty = (ch - svgH * scale) / 2;
      applyTransform();
    }

    function zoomBy(delta) {
      const cx = container.clientWidth / 2;
      const cy = container.clientHeight / 2;
      const newScale = Math.max(0.05, Math.min(20, scale * delta));
      tx = cx - (cx - tx) * (newScale / scale);
      ty = cy - (cy - ty) * (newScale / scale);
      scale = newScale;
      applyTransform();
    }

    // Controls
    const controls = document.createElement('div');
    controls.className = 'mermaid-controls';
    controls.innerHTML = `
      <button title="Auto-fit" data-action="fit">&#x2922;</button>
      <button title="Enlarge"  data-action="in">+</button>
      <button title="Shrink"   data-action="out">−</button>
    `;
    controls.addEventListener('mousedown', e => e.stopPropagation());
    controls.addEventListener('click', e => {
      const action = e.target.closest('button')?.dataset.action;
      if (action === 'fit') autoFit();
      if (action === 'in')  zoomBy(1.25);
      if (action === 'out') zoomBy(0.8);
    });
    container.appendChild(controls);

    // Auto-fit after layout
    requestAnimationFrame(autoFit);

    // Wheel zoom towards cursor
    container.addEventListener('wheel', e => {
      e.preventDefault();
      const rect  = container.getBoundingClientRect();
      const mx    = e.clientX - rect.left;
      const my    = e.clientY - rect.top;
      const delta = e.deltaY < 0 ? 1.1 : 0.9;
      const newScale = Math.max(0.05, Math.min(20, scale * delta));
      tx = mx - (mx - tx) * (newScale / scale);
      ty = my - (my - ty) * (newScale / scale);
      scale = newScale;
      applyTransform();
    }, { passive: false });

    // Drag to pan
    container.addEventListener('mousedown', e => {
      isPanning = true;
      container.classList.add('panning');
      startX = e.clientX; startY = e.clientY;
      startTx = tx;       startTy = ty;
    });

    window.addEventListener('mousemove', e => {
      if (!isPanning) return;
      tx = startTx + (e.clientX - startX);
      ty = startTy + (e.clientY - startY);
      applyTransform();
    });

    window.addEventListener('mouseup', () => {
      isPanning = false;
      container.classList.remove('panning');
    });
  }

  // ── Divider drag-to-resize ────────────────────────────────────────────────
  const divider  = document.getElementById('divider');
  const splitEl  = document.getElementById('split');

  divider.addEventListener('mousedown', e => {
    e.preventDefault();
    divider.classList.add('dragging');
    const startX     = e.clientX;
    const startWidth = editorPane.getBoundingClientRect().width;

    function onMove(e) {
      const delta    = e.clientX - startX;
      const total    = splitEl.getBoundingClientRect().width;
      const newWidth = Math.min(Math.max(startWidth + delta, 120), total - 120);
      editorPane.style.width = newWidth + 'px';
    }

    function onUp() {
      divider.classList.remove('dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
</script>
</body>
</html>
